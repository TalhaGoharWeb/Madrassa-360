name: madrasa_360
description: "Madrasa 360 - Multi-tenant SaaS ERP for Islamic Educational Institutions"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # UI & Typography
  google_fonts: ^6.1.0
  
  # State Management
  flutter_riverpod: ^2.4.9
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # Network & Connectivity
  connectivity_plus: ^6.1.5
  
  # Utilities
  intl: ^0.20.3

  # ── Supabase Backend ──────────────────────────────────────────
  supabase_flutter: ^2.5.0        # Supabase client + Auth + Realtime
  flutter_dotenv: ^5.1.0          # Env variable management (.env file)
  cached_network_image: ^3.3.1    # Student/staff photo caching
  image_picker: ^1.1.2            # Pick photos for upload
  uuid: ^4.4.0                    # Local UUID generation
  url_launcher: ^6.3.0            # Open email / phone / web links
  http: ^1.2.2                    # Direct REST calls to Supabase Admin Auth API

  # ── Local Database (offline-first sync engine, Phase 5) ───────
  # Pinned to the 2.31.x line: highest drift whose SDK constraint
  # (>=3.5.0 <4.0.0) fits this app's sdk: ^3.5.0. drift >=2.33 needs
  # Dart >=3.10 and sqlite3 ^3.x, which is incompatible with
  # sqlite3_flutter_libs. See lib/data/local/BUILD_NOTES.md.
  drift: ^2.31.0                  # Reactive SQLite layer (SDK >=3.5.0 <4.0.0)
  sqlite3_flutter_libs: ^0.5.41   # Native sqlite3 for Windows/macOS/Linux/Android/iOS (SDK >=2.12.0 <4.0.0)
  path_provider: ^2.1.5           # Per-OS app-data dir; on Windows resolves under %APPDATA% (SDK ^3.4.0)
  path: ^1.9.0                    # join() for the database file path

  # ── Reporting engine (Phase 6): offline-first PDF/CSV/XLSX ────
  # Pinned below the 3.13 line: pdf 3.12.0 is the highest version whose
  # SDK constraint (>=2.19.0 <4.0.0) fits this app's sdk: ^3.5.0
  # (pdf >=3.13 needs Dart >=3.12). Verified via pub.dev API.
  pdf: ^3.12.0                    # PDF generation (SDK >=2.19.0 <4.0.0)
  # printing 5.14.3: highest line with SDK >=3.3.0 <4.0.0
  # (printing >=5.15 needs Dart >=3.12). Verified via pub.dev API.
  printing: ^5.14.3               # PDF preview / print / system share (Flutter >=3.22.0)
  # excel 4.0.6 (latest line): pure-Dart XLSX writer,
  # SDK >=3.0.0 <4.0.0. Verified via pub.dev API.
  excel: ^4.0.6                   # XLSX export for tabular reports

  # ── One-file offline backup (Phase 6) ───────────────────────────
  # crypto is pure Dart (no native code, works offline after pub get).
  # 3.0.7's SDK constraint is ^3.4.0, which intersects this app's
  # sdk: ^3.5.0. Verified against the pub.dev API 2026-09-25.
  # Used for SHA-256 data checksums in the backup manifest ONLY —
  # nothing here performs encryption or key management.
  crypto: ^3.0.7                  # SHA-256 checksums (SDK ^3.4.0)

  # ── Push notifications (Phase 6) ──────────────────────────────
  # firebase_messaging 15.2.10 (latest 15.x; pin ^15.2.0): SDK constraint
  # >=3.2.0 <4.0.0 intersects this app's sdk: ^3.5.0 and the resolved
  # toolchain (Dart >=3.7.0). The 16.x line (firebase_core ^4.14.0) was
  # NOT pinned — its Dart lower bound is unverified and may exceed the
  # team's Dart 3.7. firebase_core ^3.15.2 is what messaging 15.2.10
  # itself depends on. Verified via the pub.dev API 2026-09-25.
  # PLATFORM NOTE: firebase_messaging ships Android/iOS/macOS/Web only —
  # no Windows/Linux implementation. PushChannel.supportsPlatform()
  # gates every call, so the Windows desktop build is unaffected and
  # push rows are marked 'skipped' there (documented no-op, never a
  # MissingPluginException crash).
  firebase_core: ^3.15.2             # Firebase init (Android/iOS/macOS only)
  firebase_messaging: ^15.2.0        # FCM push (Android/iOS/macOS only)

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Codegen for drift. drift_dev must track the drift minor version
  # (2.31.x <-> 2.31.x); build_runner ^2.10.0 is the line whose
  # analyzer (^8.0.0) intersects drift_dev 2.31.0's analyzer
  # (>=8.1.0 <11.0.0). Codegen runs on the dev/CI machine, which
  # needs Dart >=3.7.0 for build_runner.
  drift_dev: ^2.31.0              # Generator (SDK >=3.5.0 <4.0.0)
  build_runner: ^2.10.0           # Build system (SDK ^3.7.0)

flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/
    - version.json   # release source of truth; read at runtime by UpdateService
  
  # Fonts
  # JameelNooriNastaleeq → v4 TTF (display). The family name is kept because
  # tenant branding rows and PDF rendering reference it.
  # JameelNooriKasheeda → kasheeda subset TTF (hero moments only).
  # NotoNaskhArabic → body and small text.
  fonts:
    - family: JameelNooriNastaleeq
      fonts:
        - asset: assets/fonts/JameelNooriNastaleeq-v4.ttf
    - family: JameelNooriKasheeda
      fonts:
        - asset: assets/fonts/JameelNooriNastaleeqKasheeda-subset.ttf
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700
